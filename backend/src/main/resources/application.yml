spring:
  application:
    name: civic-resolution

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:civic_resolution}
    username: ${DB_USER:civic}
    password: ${DB_PASSWORD:civic}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

civic:
  resolution:
    identity-window-minutes: 10
    location-radius-meters: 50

logging:
  level:
    com.workdna.civic: INFO
