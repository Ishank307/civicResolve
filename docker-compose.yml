services:
  postgres:
    image: postgres:16-alpine
    container_name: civic-postgres
    environment:
      POSTGRES_DB: civic_resolution
      POSTGRES_USER: civic
      POSTGRES_PASSWORD: civic
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civic -d civic_resolution"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
